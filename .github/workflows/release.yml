name: Signed Android release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SPESA_KEYSTORE_BASE64: ${{ secrets.SPESA_KEYSTORE_BASE64 }}
      SPESA_STORE_PASSWORD: ${{ secrets.SPESA_STORE_PASSWORD }}
      SPESA_KEY_ALIAS: ${{ secrets.SPESA_KEY_ALIAS }}
      SPESA_KEY_PASSWORD: ${{ secrets.SPESA_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate version and signing configuration
        run: |
          node scripts/release-metadata.cjs
          for variable in SPESA_KEYSTORE_BASE64 SPESA_STORE_PASSWORD SPESA_KEY_ALIAS SPESA_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Configure repository secret $variable before publishing a release."
              exit 1
            fi
          done
          printf '%s' "$SPESA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/spesa-release.jks"
          echo "SPESA_KEYSTORE_PATH=$RUNNER_TEMP/spesa-release.jks" >> "$GITHUB_ENV"
      - run: chmod +x gradlew
      - name: Test and build signed APK
        run: ./gradlew testReleaseUnitTest lintRelease assembleRelease
      - name: Verify signature and prepare artifact
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "SpesaFacile-${GITHUB_REF_NAME}.apk"
          sha256sum "SpesaFacile-${GITHUB_REF_NAME}.apk" > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            SpesaFacile-*.apk
            SHA256SUMS.txt
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/spesa-release.jks"
